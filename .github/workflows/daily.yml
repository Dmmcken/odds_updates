name: daily-odds
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      - name: Commit data
        run: |
          if [ -d data ]; then
            git config user.name "odds-bot"
            git config user.email "odds-bot@users.noreply.github.com"
            git add data/
            git commit -m "daily snapshot $(date -u +%F)" || echo "nothing to commit"
            git push
          else
            echo "no data folder yet, skipping commit"
          fi
